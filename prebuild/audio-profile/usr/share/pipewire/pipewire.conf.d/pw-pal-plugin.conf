context.modules = [
{   name = libpipewire-module-pal
    args = {
        node.name = "pal_sink_speaker"
        node.description = "pal sink speaker"
        stream.props = {
            audio.position = [ FL FR ]
        }
        media.class = "Audio/Sink"
        media.role = "music"
    }
},
{   name = libpipewire-module-pal
    args = {
        node.name = "pal_sink_headset"
        node.description = "pal sink headset"
        stream.props = {
            audio.position = [ FL FR ]
        }
        media.class = "Audio/Sink"
        media.role = "music"
    }
},
{   name = libpipewire-module-pal
    args = {
        node.name = "pal_source_speaker_mic"
        node.description = "pal source handset mic"
        stream.props = {
            audio.position = [ FL FR ]
            # 必须写在 stream.props 里: 放在 args 顶层不会成为节点属性(pw-dump
            # 里查不到 priority.session), wireplumber 因此读不到。取值需高于
            # pal_sink_*(未设置即为 0), 否则 default.audio.source 会选中 sink,
            # pipewire-pulse 报的默认源就不是 source, gnome-control-center 的
            # Gvc 收不到 active-input-update -> 声音面板显示 "No Input Devices"。
            priority.session = 2000
        }
        media.class = "Audio/Source"
    }
},
{   name = libpipewire-module-pal
    args = {
        node.name = "pal_source_headset_mic"
        node.description = "pal source headset mic"
        stream.props = {
            audio.position = [ FL FR ]
            # 见 pal_source_speaker_mic 的说明, 略低于 handset 使其为备选默认源
            priority.session = 1900
        }
        media.class = "Audio/Source"
    }
},
{   name = libpipewire-module-pal
    args = {
        node.name = "pal_sink_dp_out"
        node.description = "pal sink dp audio"
        stream.props = {
            audio.position = [ FL FR ]
        }
        media.class = "Audio/Sink"
        media.role = "notification"
        jack-name = "HDMI/DP0 Jack"
    }
},
{   name = libpipewire-module-pal
    args = {
        node.name = "pal_sink_hdmi_out"
        node.description = "pal sink hdmi audio"
        stream.props = {
            audio.position = [ FL FR ]
        }
        media.class = "Audio/Sink"
        media.role = "notification"
        jack-name = "HDMI/DP1 Jack"
    }
}
]
