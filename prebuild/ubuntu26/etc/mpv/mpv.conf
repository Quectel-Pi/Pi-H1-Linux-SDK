# Hardware decoding defaults for this board.
#
# Keep in step with prebuild/gnome/etc/mpv/mpv.conf: the two files serve the
# Ubuntu (ubuntu26) and Debian (gnome) rootfs overlays respectively, and the
# board's VA driver, mpv and panel path are the same in both.
#
# mpv ships with hwdec=no, so without this file every file decodes on the CPU.
# 4K and up: the GL path drops most frames while scaling to the panel, while the
# Wayland dmabuf passthrough drops almost none, so large sources use it. Smaller
# frames stay on vo=gpu, which keeps OSD and subtitles (dmabuf-wayland renders
# video only).
#
# The nil guards in the profile condition are required: width/height are unset
# until the stream is known and comparing nil raises a Lua error that aborts
# playback ("Errors when loading file").
#
# hwdec=vaapi-copy is deliberate for vo=gpu: Mesa cannot import the decoder's
# dmabufs back into GL on this board ("MESA: warning: Failed to set BO metadata
# with DRM_MSM_GEM_INFO: -22"), so that path downloads the frame either way and
# the copy only costs CPU. dmabuf-wayland hands the decoder buffer straight to
# the compositor, so there the copy is pure overhead - stable-playback 4K60
# H.264 measured on the board: 46 fps rendered with hwdec=vaapi against 18.6 fps
# with hwdec=vaapi-copy, and 4K30 is a clean 30/30 either way.
hwdec=vaapi-copy

[large-frames]
profile-desc=DMABUF passthrough for >=1440p sources
profile-cond=width ~= nil and height ~= nil and (width >= 2560 or height >= 1440)
profile-restore=copy
hwdec=vaapi
vo=dmabuf-wayland,gpu
