# Hardware decoding defaults for this board.
#
# Keep in step with prebuild/gnome/etc/mpv/mpv.conf: the two files serve the
# Ubuntu (ubuntu26) and Debian (gnome) rootfs overlays respectively, and the
# board's VA driver, mpv and panel path are the same in both.
#
# mpv ships with hwdec=no, so without this file every file decodes on the CPU.
#
# Where playback stutters on this board is the *handoff to the compositor*, not
# decode. Counted wl_surface.commits on 2560x1440 60fps H.264 (panel is
# 2560x1440@60):
#
#   dmabuf-wayland + hwdec=vaapi-copy  59.8 fps, p95 frame gap 18 ms
#   dmabuf-wayland + hwdec=no (sw)     60.1 fps, p95 frame gap 20 ms
#   dmabuf-wayland + hwdec=vaapi       52.8 fps, p95 frame gap 43 ms
#   vo=gpu         + hwdec=vaapi-copy  ~48 fps (1080p60, frame-drop-count)
#   vo=gpu         + hwdec=vaapi        29 fps
#
# All three dmabuf-wayland modes hand mutter the same wl_buffer description
# (NV12, modifier 0, 3840x2160), so the pixel format is not what differs: with
# hwdec=vaapi mpv forwards the Venus/V4L2 capture buffer itself, while
# vaapi-copy and hwdec=no forward buffers from its own pool. The zero-copy mode
# is the one whose commits arrive late, i.e. its VO waits on buffers the
# compositor has not released yet.
#
# The "Failed to set BO metadata with DRM_MSM_GEM_INFO: -22" warning is a red
# herring: the GL paths log it and still work (gst-play 4K60 = 59.4 fps), while
# dmabuf-wayland never logs it and is the stuttery one.
#
# So: vaapi-copy below 4K, where the copy buys more than it costs. At 4K it is
# 12.4 MB/frame of CPU download and collapses to 7.4 fps at 4K60, so there the
# decoder buffer goes straight through instead (33.6 fps at 4K60, 4K30 is 2
# dropped frames/s). 4K60 in mpv stays below 60 whatever the VO does - for 4K60
# use gst-play-1.0 (59.4 fps) or stock totem (49.9 fps). Software decode is
# purely CPU-bound: 4K30 is flawless (0 dropped) at 4 cores, 4K60 only 15 fps at
# 5.4 of 8.
#
# Below 1080p frames stay on vo=gpu, which is cheap at that size.
#
# The nil guards in the profile condition are required: width/height are unset
# until the stream is known and comparing nil raises a Lua error that aborts
# playback ("Errors when loading file").
hwdec=vaapi-copy

[dmabuf-copy]
profile-desc=DMABUF passthrough with mpv-owned buffers, 1080p up to 4K
profile-cond=width ~= nil and height ~= nil and (width >= 1920 or height >= 1080) and width < 3840 and height < 2160
profile-restore=copy
hwdec=vaapi-copy
vo=dmabuf-wayland,gpu

[dmabuf-zerocopy]
profile-desc=zero-copy DMABUF passthrough, 4K and up
profile-cond=width ~= nil and height ~= nil and (width >= 3840 or height >= 2160)
profile-restore=copy
hwdec=vaapi
vo=dmabuf-wayland,gpu
