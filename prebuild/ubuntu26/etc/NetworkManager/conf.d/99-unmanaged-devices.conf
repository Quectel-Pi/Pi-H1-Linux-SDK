# eth0 (PCIe yt6801) must stay managed by NetworkManager, otherwise the
# GNOME/desktop network switch cannot turn the wired link off: NM sends
# "device-disconnect" but never brings the link down, dhcpcd then re-leases
# eth0 and NM re-adopts it as "external", so the switch flips back on.
# eth1..eth3 are not wired out on this board and stay unmanaged.
[keyfile]
unmanaged-devices=interface-name:eth1;interface-name:eth2;interface-name:eth3
