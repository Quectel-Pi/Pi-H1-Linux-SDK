%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/qcom,inline-crypto-engine.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. (QTI) Inline Crypto Engine

maintainers:
  - Bjorn Andersson <andersson@kernel.org>

properties:
  compatible:
    items:
      - enum:
          - qcom,sa7255p-inline-crypto-engine
          - qcom,sa8255p-inline-crypto-engine
          - qcom,sm8450-inline-crypto-engine
          - qcom,sm8550-inline-crypto-engine
          - qcom,sm8650-inline-crypto-engine
      - const: qcom,inline-crypto-engine

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  qcom,ice-use-hwkm:
    type: boolean
    description:
      Use the supported Hardware Key Manager (HWKM) in Qualcomm
      ICE to support wrapped keys. This dictates if wrapped keys
      have to be used by ICE.

  qcom,ice-skip-clk:
    type: boolean
    description:
      Skip to get GCC_UFS_PHY_ICE_CORE_CLK in ICE driver. This
      dictates if ICE driver request this clock on/off.

  operating-points-v2:
    description:
      Optional phandle to an OPP table node that defines supported ICE
      frequencies and required power states. If not present, driver will
      use fixed clock rate. The required-opps property in each OPP entry
      must reference valid power domain OPP entries (e.g., rpmhpd_opp_*).

  opp-table:
    type: object

required:
  - compatible
  - reg
  - oneof:
    - clocks
    - qcom,ice-skip-clk

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,sm8550-gcc.h>

    crypto@1d88000 {
      compatible = "qcom,sm8550-inline-crypto-engine",
                   "qcom,inline-crypto-engine";
      reg = <0x01d88000 0x8000>;
      clocks = <&gcc GCC_UFS_PHY_ICE_CORE_CLK>;
      operating-points-v2 = <&ice_opp_table>;

      ice_opp_table: opp-table {
          compatible = "operating-points-v2";

          opp-201600000 {
              opp-hz = /bits/ 64 <201600000>;
              required-opps = <&rpmhpd_opp_svs_l1>;
          };

          opp-403200000 {
              opp-hz = /bits/ 64 <403200000>;
              required-opps = <&rpmhpd_opp_nom>;
          };
       };
    };

  - |
    crypto@1d88000 {
      compatible = "qcom,sa8255p-inline-crypto-engine",
                   "qcom,inline-crypto-engine",
      reg = <0x01d88000 0x8000>;
      qcom,ice-skip-clk;
      operating-points-v2 = <&ice_opp_table>;

      ice_opp_table: opp-table {
          compatible = "operating-points-v2";

          opp-201600000 {
              opp-hz = /bits/ 64 <201600000>;
              required-opps = <&rpmhpd_opp_svs_l1>;
          };

          opp-403200000 {
              opp-hz = /bits/ 64 <403200000>;
              required-opps = <&rpmhpd_opp_nom>;
          };
       };
    };
...
