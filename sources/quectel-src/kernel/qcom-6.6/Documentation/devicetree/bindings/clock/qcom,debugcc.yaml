%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,debugcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. Debug Clock Controller

maintainers:
  - Imran Shaik <quic_imrashai@quicinc.com>
  - Taniya Das <quic_tdas@quicinc.com>

description: |
  Debug clock controller module used to read the clock measurement of
  other clock controller clocks.

properties:
  compatible:
    enum:
      - qcom,measure-debugcc-qcs8300
      - qcom,measure-debugcc-sa8775p

  clocks:
    items:
      - description: Board XO source
      - description: CAMCC clock source
      - description: DISPCC0 clock source
      - description: DISPCC1 clock source
      - description: GCC clock source
      - description: GPUCC clock source
      - description: VIDEOCC clock source

  clock-names:
    items:
      - const: xo_clk_src
      - const: camcc
      - const: dispcc0
      - const: dispcc1
      - const: gcc
      - const: gpucc
      - const: videocc

  qcom,apsscc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle to the APSS CC device node

  qcom,camcc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle to the Camera CC device node

  qcom,dispcc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle to the Display CC device node

  qcom,gcc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle to the GCC device node

  qcom,gpucc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle to the GPU CC device node

  qcom,mccc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle to the Memory Controller CC device node

  qcom,videocc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle to the Video CC device node

required:
  - compatible
  - clocks
  - clock-names
  - qcom,gcc
  - qcom,apsscc
  - qcom,mccc

additionalProperties: true

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmh.h>
    debugcc: qcom,cc-debug {
        compatible = "qcom,measure-debugcc-qcs8300";
        qcom,gcc = <&gcc>;
        qcom,gpucc = <&gpucc>;
        qcom,videocc = <&videocc>;
        qcom,dispcc = <&dispcc>;
        qcom,camcc = <&camcc>;
        qcom,apsscc = <&apsscc>;
        qcom,mccc = <&mccc>;
        clocks = <&rpmhcc RPMH_CXO_CLK>,
                 <&camcc 0>,
                 <&dispcc0 0>,
                 <&gcc 0>,
                 <&gpucc 0>,
                 <&videocc 0>;
        clock-names = "xo_clk_src",
                      "camcc",
                      "dispcc",
                      "gcc",
                      "gpucc",
                      "videocc";
        #clock-cells = <1>;
    };
...
