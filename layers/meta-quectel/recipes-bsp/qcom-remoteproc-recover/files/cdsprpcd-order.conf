# Drop-in installed by the qcom-remoteproc-recover recipe.
#
# cdsprpcd ships with Restart=always and no ordering at all, so on a boot where
# the CDSP still runs the firmware of the previous boot it fails, is restarted
# every 10 s, and each restart contends with the PAS reset that
# qcom-remoteproc-recover.service is driving on the same remoteproc node.
#
# A failed PAS start is what actually resets the DSP, so a second writer that
# keeps touching the domain prevents the clean reset instead of helping: one
# boot recorded 21 "powering up a300000.remoteproc" attempts from three writers
# and never brought the CDSP up.  Ordering cdsprpcd after the recovery unit
# gives the recovery the exclusive window it needs.
[Unit]
After=qcom-remoteproc-recover.service
