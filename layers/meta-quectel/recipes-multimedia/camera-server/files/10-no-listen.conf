# cam-server 的 EzTune 调试通道在源码里是写死的：
#   sources/.../chi-cdk-kt/api/generated/g_parser/parametereztunecom.cpp
#     SetupSocket()            -> Address.Sin.sin_addr.s_addr = INADDR_ANY
#     parametereztunecombase.h -> ExternalPort = 0x5143 (20803)
# 没有配置文件、没有环境变量、没有命令行开关能把它 rebind 到 127.0.0.1，
# 所以没法照 rgpiod 那样靠改绑定地址拿到 closed。
#
# 换成在 cgroup 层禁掉这段端口的 bind 能力。OpenPort() 里 bind 失败会依次递增
# 端口重试，最多 64 个（20803..20867），所以整段一起禁：
#   bind() -> EPERM -> 重试一圈全失败 -> 进程继续运行（日志一句
#   "EzTune Failed to bind any ports"），但 20803 不再有任何监听。
# 于是 LAN 上的 SYN 由内核直接回 RST，nmap 显示 closed，而不是 filtered（
# filtered 是"有监听但丢包"，仍然会被扫出来），也不出现在开放端口列表里。
#
# 代价：EzTune 通道彻底不可用 —— 不是"只监听本地"，是干脆不监听。
# 板上本来没有任何程序连 20803（PC 侧 Chromatic 工具正是要挡掉的那条路），
# 需要在本机继续用 EzTune 的话只能改源码，配置文件这条路到此为止。
#
# 范围只限 20803-20867，cam-server 别的 socket（/tmp/socket/cam_server 下的
# AF_UNIX 等）不受影响。
[Service]
SocketBindDeny=ipv4:tcp:20803-20867
