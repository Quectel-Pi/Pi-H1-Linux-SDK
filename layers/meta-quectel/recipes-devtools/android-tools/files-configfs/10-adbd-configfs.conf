# meta-quectel override of meta-oe android-tools-conf-configfs drop-in
[Unit]
# A single OOM kill used to be enough to leave adbd permanently failed: six
# fast failed starts (~3 s) hit the default start limit ("Start request
# repeated too quickly") and nothing ever retried, so USB stayed dead until
# reboot. Retry forever instead, with a small delay so a hard failure cannot
# spin.
StartLimitIntervalSec=0

[Service]
RestartSec=2
# Upstream android-tools-adbd.service already carries
# "ExecStartPre=-/usr/bin/android-gadget-setup adb" (note the '-'). The
# unhyphenated duplicate that used to live here ran a second time and failed
# the whole unit whenever configfs still had leftovers.
# ExecStopPost=android-gadget-cleanup is deliberately not used: qusb owns the
# 902D composition, tearing the gadget down on every adbd restart drops
# DIAG/AT until the next boot.
ExecStartPost=-/usr/bin/android-gadget-start
