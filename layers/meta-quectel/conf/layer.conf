# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS        += "quectel"
BBFILE_PATTERN_quectel := "^${LAYERDIR}/"
BBFILE_PRIORITY_quectel = "10"

LAYERSERIES_COMPAT_quectel = "nanbield scarthgap"

# This layer's own directory, so classes and recipes can resolve paths such as
# file://conf/deb-track/*.txt without hardcoding the layer name.
META_QUECTEL_DIR := "${LAYERDIR}"

# Central package-version table (DEB_PR:pn-<recipe>), bumped automatically by
# quectel_build/tools/deb-iterate.sh.  Optional: recipes fall back to r0 when
# there is no entry.
include ${LAYERDIR}/conf/deb-track/versions.inc
