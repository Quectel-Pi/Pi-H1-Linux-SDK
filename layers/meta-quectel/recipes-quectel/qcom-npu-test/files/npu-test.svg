<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="20" fill="#1a73e8"/>
  <!-- chip body -->
  <rect x="28" y="28" width="72" height="72" rx="8" fill="#0d47a1" stroke="#42a5f5" stroke-width="2"/>
  <!-- pins on 4 sides -->
  <g fill="#42a5f5">
    <rect x="18" y="40" width="10" height="4"/>
    <rect x="18" y="52" width="10" height="4"/>
    <rect x="18" y="64" width="10" height="4"/>
    <rect x="18" y="76" width="10" height="4"/>
    <rect x="100" y="40" width="10" height="4"/>
    <rect x="100" y="52" width="10" height="4"/>
    <rect x="100" y="64" width="10" height="4"/>
    <rect x="100" y="76" width="10" height="4"/>
    <rect x="40" y="18" width="4" height="10"/>
    <rect x="52" y="18" width="4" height="10"/>
    <rect x="64" y="18" width="4" height="10"/>
    <rect x="76" y="18" width="4" height="10"/>
    <rect x="40" y="100" width="4" height="10"/>
    <rect x="52" y="100" width="4" height="10"/>
    <rect x="64" y="100" width="4" height="10"/>
    <rect x="76" y="100" width="4" height="10"/>
  </g>
  <!-- neural net nodes -->
  <g fill="#e3f2fd">
    <circle cx="50" cy="50" r="5"/>
    <circle cx="78" cy="50" r="5"/>
    <circle cx="50" cy="78" r="5"/>
    <circle cx="78" cy="78" r="5"/>
    <circle cx="64" cy="64" r="7" fill="#fff176"/>
  </g>
  <!-- connections -->
  <g stroke="#e3f2fd" stroke-width="1.5" opacity="0.8">
    <line x1="50" y1="50" x2="64" y2="64"/>
    <line x1="78" y1="50" x2="64" y2="64"/>
    <line x1="50" y1="78" x2="64" y2="64"/>
    <line x1="78" y1="78" x2="64" y2="64"/>
  </g>
  <text x="64" y="118" font-family="sans-serif" font-size="12" font-weight="bold"
        fill="#fff" text-anchor="middle">NPU</text>
</svg>
