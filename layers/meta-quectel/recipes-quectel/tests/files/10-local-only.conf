# rgpiod 纯配置改绑 loopback，不用防火墙、不用改代码。
#
# -l 单独用不够：rgpiod 会走 AF_INET6 分支，只绑 [::1]（纯 IPv6 loopback，
# 没有 IPv4 映射地址），走 127.0.0.1:8889 的 pigpio 客户端连不上。
# -n 127.0.0.1 让 gNumSockNetAddr 非 0，跳过 IPv6 分支走 AF_INET，
# 该分支再按 -l 把地址设成 INADDR_LOOPBACK（见 rgpiod.c xOpenSocket）。
# 两个一起用才得到 127.0.0.1:8889。副作用是客户端白名单也只剩 127.0.0.1，
# 与「只准本机」一致。
#
# 效果：socket 只 LISTEN 在 127.0.0.1，LAN 来的 SYN 匹配不到监听者，
# 内核直接回 RST —— 外部扫到的是 closed，而不是 filtered（无回应）。
[Service]
ExecStart=
ExecStart=/usr/bin/rgpiod -l -n 127.0.0.1 -p 8889
