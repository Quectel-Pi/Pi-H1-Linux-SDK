# Common removable-media filesystems: USB sticks, SD cards, external disks,
# NAS shares. The block layer already provides the transports
# (USB_STORAGE=y, USB_UAS=y, MMC_SDHCI_MSM=y, BLK_DEV_SD=y, BLK_DEV_LOOP=y),
# only the filesystem drivers were missing.

CONFIG_EXFAT_FS=y
CONFIG_NTFS3_FS=y
CONFIG_NTFS3_FS_POSIX_ACL=y
CONFIG_F2FS_FS=y
CONFIG_XFS_FS=y
CONFIG_EROFS_FS=y

# SMB / NAS shares, module like every other distro kernel
CONFIG_CIFS=m

# NLS: exfat and ntfs3 default to iocharset=utf8 and refuse to mount without
# this table; the codepages are what vfat uses for CJK long filenames
# (mount -o codepage=936,iocharset=utf8).
CONFIG_NLS_UTF8=y
CONFIG_NLS_CODEPAGE_936=y
CONFIG_NLS_CODEPAGE_950=y
CONFIG_NLS_CODEPAGE_932=y
CONFIG_NLS_CODEPAGE_949=y
