<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- rounded background: deep teal-blue, calm "time/archive" tone -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0b5566"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- capsule body (cylinder) -->
  <!-- bottom ellipse -->
  <ellipse cx="64" cy="96" rx="34" ry="11" fill="#155e75"/>
  <!-- side wall -->
  <rect x="30" y="44" width="68" height="52" fill="url(#glass)"/>
  <!-- top ellipse (cap) -->
  <ellipse cx="64" cy="44" rx="34" ry="11" fill="#99f6e4"/>

  <!-- cap rim highlight -->
  <ellipse cx="64" cy="44" rx="28" ry="8.5" fill="none" stroke="#ccfbf1" stroke-width="1.4" opacity="0.8"/>

  <!-- center label band -->
  <rect x="30" y="60" width="68" height="16" fill="#0e7490" opacity="0.55"/>
  <!-- clock hands on the label = "time" capsule -->
  <circle cx="64" cy="68" r="6.5" fill="none" stroke="#f0fdfa" stroke-width="1.6"/>
  <line x1="64" y1="68" x2="64" y2="63" stroke="#f0fdfa" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="64" y1="68" x2="68" y2="70" stroke="#f0fdfa" stroke-width="1.6" stroke-linecap="round"/>

  <!-- vertical restore/upgrade arrows on the capsule sides -->
  <!-- left: down (rollback) -->
  <g stroke="#f0fdfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
    <line x1="19" y1="54" x2="19" y2="74"/>
    <polyline points="14,68 19,74 24,68"/>
  </g>
  <!-- right: up (upgrade) -->
  <g stroke="#f0fdfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
    <line x1="109" y1="74" x2="109" y2="54"/>
    <polyline points="104,60 109,54 114,60"/>
  </g>

  <!-- small star/dot accents inside glass (archive snapshots) -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="48" cy="86" r="1.8"/>
    <circle cx="64" cy="88" r="1.8"/>
    <circle cx="80" cy="86" r="1.8"/>
  </g>
</svg>
