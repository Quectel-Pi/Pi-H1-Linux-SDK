alias join_ct "spectate 0; jointeam 2; menuselect 1; joinclass 1"
alias join_t  "spectate 0; jointeam 1; menuselect 1; joinclass 1"

bind "F1" "join_ct"
bind "F2" "join_t"
alias autobuy_ct_primary   "buy m4a1"
alias autobuy_ct_fallback  "buy famas; buy mp5; buy m3"
alias autobuy_ct           "autobuy_ct_primary; autobuy_ct_fallback; buy vesthelm; buy defuser; buy flash; buy hegrenade"

alias autobuy_t_primary    "buy ak47"
alias autobuy_t_fallback   "buy galil; buy mp5; buy m3"
alias autobuy_t            "autobuy_t_primary; autobuy_t_fallback; buy vesthelm; buy flash; buy hegrenade"

alias autobuy_smart_ct     "autobuy_ct"
alias autobuy_smart_t      "autobuy_t"

bind "F4" "autobuy_smart"
alias autobuy_smart "autobuy_smart_ct; autobuy_smart_t"

bind "=" "bot_add"
bind "-" "bot_kick"
// 使用经典 CS1.6 菜单 (禁用扩展/触屏菜单, 否则 chooseteam 走 touch 路径无 UI)
_extended_menus 0
_vgui_menus 0

// 经典键位: 空格跳 + 右键瞄准 (+attack2), 右键开镜/消音器
bind "SPACE" "+jump"
bind "MOUSE2" "+attack2"
unbind "MOUSE4"
